sid icmp_socket u:object_r:kernel_t:s0
sid tcp_socket u:object_r:kernel_t:s0
sid sysctl_modprobe u:object_r:kernel_t:s0
sid sysctl u:object_r:kernel_t:s0
sid sysctl_fs u:object_r:kernel_t:s0
sid sysctl_kernel u:object_r:kernel_t:s0
sid sysctl_net u:object_r:kernel_t:s0
sid sysctl_net_unix u:object_r:kernel_t:s0
sid sysctl_vm u:object_r:kernel_t:s0
sid sysctl_dev u:object_r:kernel_t:s0
sid kmod u:object_r:kernel_t:s0
sid policy u:object_r:kernel_t:s0
sid scmp_packet u:object_r:kernel_t:s0
sid devnull u:object_r:kernel_t:s0

genfscon rootfs / u:object_r:kernel_t:s0
genfscon devtmpfs / u:object_r:kernel_t:s0
genfscon proc / u:object_r:kernel_t:s0
genfscon sysfs / u:object_r:kernel_t:s0
genfscon selinuxfs / u:object_r:kernel_t:s0
